<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route review</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; color: #0f172a; }
      #app { display: flex; height: 100vh; }
      #map { flex: 1 1 55%; }
      #panel { flex: 1 1 45%; overflow-y: auto; padding: 12px 16px; border-left: 1px solid #e2e8f0; }
      h1 { font-size: 18px; margin: 4px 0 8px; }
      h2 { font-size: 15px; margin: 18px 0 6px; }
      .row { border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 8px; margin: 6px 0; cursor: pointer; }
      .row.active { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
      .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
      .muted { color: #64748b; font-size: 12px; }
      .dossier { margin: 4px 0 0 18px; padding: 0; font-size: 12px; color: #334155; }
      .claude { background: #f1f5f9; border-radius: 4px; padding: 2px 6px; font-size: 12px; margin-top: 4px; }
      button { font: inherit; padding: 2px 8px; }
      .save { position: sticky; bottom: 0; background: white; padding: 8px 0; border-top: 1px solid #e2e8f0; }
      table { border-collapse: collapse; }
      td, th { padding: 4px 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
